version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: reacharis-postgres
    restart: always
    environment:
      POSTGRES_USER: reacharis_admin
      POSTGRES_PASSWORD: ReacharisSuperSecretDBPassword2026
      POSTGRES_DB: reacharis_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
